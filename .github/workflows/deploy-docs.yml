name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install mkdocs-material pytesseract Pillow

      - name: Mask numbers in screenshots
        run: python3 scripts/mask_numbers.py

      - name: Build garage docs
        run: mkdocs build -f garage/mkdocs.yml --site-dir ../site-out/garage

      - name: Build trucking docs
        run: mkdocs build -f trucking/mkdocs.yml --site-dir ../site-out/trucking

      - name: Copy root landing page
        run: cp index.html site-out/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
